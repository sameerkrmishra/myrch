# Settings shared by every machine. Machine-specific values (disk, hostname,
# user, profile, GPU, modules) are asked by install.sh and saved to
# /etc/myrch.conf on the installed system.

TIMEZONE="Asia/Kolkata"
LOCALES=("en_US.UTF-8 UTF-8" "hi_IN UTF-8")
LANG_DEFAULT="en_US.UTF-8"
KEYMAP="us"

DEFAULT_USER="sameer"
USER_SHELL="/usr/bin/zsh"

# Both paths are relative to the user's home directory.
DOTFILES_REPO="https://github.com/sameerkrmishra/dotfiles"
DOTFILES_DIR="git/dotfiles"
MYRCH_DIR="git/myrch"

ESP_SIZE_MIB=1024
SWAP_SIZE_DEFAULT="4G"

# Optional modules install.sh pre-selects (you still get asked about each).
OPTIONAL_DEFAULT_YES=(dev apps vpn)
